name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 1
  RUST_TEST_THREADS: 1
jobs:
  check:
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, 1.98.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install selected Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - name: Select toolchain
        run: rustup default ${{ matrix.toolchain }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release --no-default-features
      - run: cargo run --locked --release --example fuzz_replay -- 20000
      - run: cargo bench --locked --bench qualification --no-default-features
      - run: cargo bench --locked --bench qualification --features reversible
